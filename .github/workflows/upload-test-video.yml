name: Upload approved jewelry video

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-test-video:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: ${{ !hashFiles('video-shotcraft-test/output/gold-jewelry-approved-15s.mp4') }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg
        if: ${{ !hashFiles('video-shotcraft-test/output/gold-jewelry-approved-15s.mp4') }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install video renderer dependencies
        if: ${{ !hashFiles('video-shotcraft-test/output/gold-jewelry-approved-15s.mp4') }}
        working-directory: video-shotcraft-test
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Render video when it is not present
        if: ${{ !hashFiles('video-shotcraft-test/output/gold-jewelry-approved-15s.mp4') }}
        working-directory: video-shotcraft-test
        run: bash render.sh

      - name: Verify video output
        run: test -s video-shotcraft-test/output/gold-jewelry-approved-15s.mp4

      - name: Upload approved jewelry video
        uses: actions/upload-artifact@v4
        with:
          name: Sean-Gold-Jewelry-Approved-01
          path: video-shotcraft-test/output/gold-jewelry-approved-15s.mp4
          if-no-files-found: error
          retention-days: 7
