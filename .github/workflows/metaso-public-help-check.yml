name: Shotcraft - Metaso public help check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/metaso-public-help-check.yml']
permissions:
  contents: read
jobs:
  public-help:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read unauthenticated public help assets with all token literals redacted
        shell: python
        run: |
          import concurrent.futures
          import html
          import json
          import re
          from urllib.parse import urljoin, urlparse
          from urllib.request import Request, urlopen

          PAGE = 'https://metaso.cn/minimax-h3'
          def load(url):
              host = urlparse(url).hostname or ''
              if host != 'metaso.cn' and not host.endswith('.metaso.cn'):
                  return ''
              try:
                  with urlopen(Request(url, headers={'User-Agent': 'Mozilla/5.0'}), timeout=15) as r:
                      return r.read(6_000_000).decode('utf-8', 'replace')
              except Exception:
                  return ''
          def scrub(text):
              text = re.sub(r'\b(?:mk|sk)-[A-Za-z0-9_-]+', '[TOKEN_LITERAL_REDACTED]', text)
              text = re.sub(r'(?i)Bearer\s+[A-Za-z0-9_.-]+', 'Bearer [REDACTED]', text)
              return text

          root = load(PAGE)
          print('Public HTML bytes:', len(root))
          urls = list(dict.fromkeys(urljoin(PAGE, html.unescape(s)) for s in re.findall(r'<script[^>]+src=[\"\x27]([^\"\x27]+)', root)))[:45]
          print('Public script assets:', len(urls))
          texts = [(PAGE, root)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              texts += list(zip(urls, pool.map(load, urls)))
          needles = ['示例模式', '请求管理', '控制台', 'apiKey', 'api_key', 'mk-']
          for url, body in texts:
              hits = []
              for needle in needles:
                  pos = 0
                  for _ in range(4):
                      i = body.find(needle, pos)
                      if i < 0:
                          break
                      hits.append({'needle': needle, 'context': scrub(body[max(0, i-300):i+450])})
                      pos = i + len(needle)
              if hits:
                  print(json.dumps({'public_asset': url, 'matches': hits}, ensure_ascii=False))
          print('No stored secrets read. No authenticated request, upload, video generation, purchase or recharge performed.')
