name: Hari Malaysia - supplemental visuals
on:
  push:
    branches: ['shotcraft/hari-malaysia-delivery-20260916']
    paths: ['.github/workflows/hari-malaysia-supplement.yml']
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public visual sources
        run: |
          mkdir -p extra
          python3 - <<'PY'
          import urllib.request, pathlib, time, json
          targets=[('flag.svg','https://upload.wikimedia.org/wikipedia/commons/6/66/Flag_of_Malaysia.svg'),('bako.jpg','https://upload.wikimedia.org/wikipedia/commons/9/9d/Bako_beach_stone_formations_%2827136204283%29.jpg')]
          for name,url in targets:
            for attempt in range(4):
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'ShotcraftEditorial/1.0 (documentary; educational; attribution preserved)'})
                with urllib.request.urlopen(req,timeout=45) as r: data=r.read()
                pathlib.Path('extra',name).write_bytes(data);print(name,len(data));break
              except Exception as e: print(name,attempt,str(e)[:100]);time.sleep(3+attempt*2)
          meta='https://commons.wikimedia.org/w/api.php?action=query&format=json&prop=imageinfo&iiprop=extmetadata&titles=File%3ABako_beach_stone_formations_%2827136204283%29.jpg'
          try:
            with urllib.request.urlopen(urllib.request.Request(meta,headers={'User-Agent':'ShotcraftEditorial/1.0'}),timeout=40) as r: pathlib.Path('extra','bako_license.json').write_bytes(r.read())
          except Exception as e: print(type(e).__name__)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hari-Malaysia-Supplement
          path: extra/
          retention-days: 1
