name: Render jewelry ad V4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-jewelry-ad-v4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install video renderer dependencies
        working-directory: video-shotcraft-test
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-list | grep -i "Noto Serif CJK" | head -5 || true

      - name: Render black-gold jewelry ad V4
        working-directory: video-shotcraft-test
        run: bash render.sh

      - name: Verify video output
        run: test -s video-shotcraft-test/output/gold-jewelry-ad-v4-15s.mp4

      - name: Upload jewelry ad V4
        uses: actions/upload-artifact@v4
        with:
          name: Sean-Gold-Jewelry-Ad-V4
          path: video-shotcraft-test/output/gold-jewelry-ad-v4-15s.mp4
          if-no-files-found: error
          retention-days: 7
