name: Render jewelry real product batch V6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-jewelry-real-batch-v6:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install video renderer dependencies
        working-directory: video-shotcraft-test
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk zip
          ffmpeg -version

      - name: Type-check renderer
        working-directory: video-shotcraft-test
        run: npm run typecheck

      - name: Render three real catalog products
        working-directory: video-shotcraft-test
        env:
          MAX_CONCURRENT_RENDERS: '2'
        run: node scripts/render-catalog-batch.mjs

      - name: Verify distinct real-product outputs
        run: |
          test -s batch-output/final/product-001.mp4
          test -s batch-output/final/product-002.mp4
          test -s batch-output/final/product-003.mp4
          test -s batch-output/batch-report.md
          grep -q 'Batch workflow: PASS' batch-output/batch-report.md
          echo 'Three distinct real-product renders verified.'

      - name: Upload real jewelry batch
        uses: actions/upload-artifact@v4
        with:
          name: Sean-Jewelry-Real-Batch-V6
          path: |
            batch-output/final/*.mp4
            batch-output/previews/*.jpg
            batch-output/batch-report.md
            batch-output/qc-reports/*.json
            batch-output/props/*.json
          if-no-files-found: error
          retention-days: 7
