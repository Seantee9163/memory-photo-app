name: Render jewelry ad V2 refinement

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-jewelry-ad-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install video renderer dependencies
        working-directory: video-shotcraft-test
        run: |
          corepack enable
          if [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f yarn.lock ]]; then
            yarn install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Install ffmpeg and CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-noto-cjk
          ffmpeg -version
          fc-list | grep -i "Noto Serif CJK" | head -5 || true

      - name: Render jewelry ad V2 refinement
        working-directory: video-shotcraft-test
        run: bash render.sh

      - name: Verify video output and keyframes
        run: |
          test -s video-shotcraft-test/output/Sean-Gold-Jewelry-V2.mp4
          for frame in 0.5s 3s 6.5s 10s 14s; do test -s "video-shotcraft-test/output/keyframes/$frame.png"; done

      - name: Upload jewelry ad V2 refinement
        uses: actions/upload-artifact@v4
        with:
          name: Sean-Gold-Jewelry-V2
          path: |
            video-shotcraft-test/output/Sean-Gold-Jewelry-V2.mp4
            video-shotcraft-test/output/keyframes/*.png
          if-no-files-found: error
          retention-days: 7
